<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Tur Virtual Liceu 360°</title>
  <script src="aframe.min.js"></script>
  <style>
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 999;
      padding: 10px 20px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      text-decoration: none;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <a href="kiosk.html" class="back-btn">⬅ Înapoi la Kiosk</a>

  <a-scene>
    <a-assets>
      <!-- Imagini Placeholder 360 de pe Wikimedia Commons -->
      <img id="hol" src="https://upload.wikimedia.org/wikipedia/commons/6/69/Hallway_360_panorama.jpg" crossorigin="anonymous">
      <img id="biblioteca" src="https://upload.wikimedia.org/wikipedia/commons/f/f0/Panorama_inside_a_library.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- Panorama Curentă -->
    <a-sky id="sky-box" src="#hol"></a-sky>

    <!-- Camera cu controale mobile/VR -->
    <a-entity camera look-controls></a-entity>
  </a-scene>
</body>
</html>
